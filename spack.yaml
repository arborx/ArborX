spack:
  specs:
  - boost
  - ninja
  - openmpi
  - trilinos@16.2.0 -amesos -amesos2 -belos +exodus -ifpack2 -muelu +mpi +panzer
  concretizer:
    unify: false
  config:
    install_tree:
      root: /opt/spack
      padded_length: 128
  mirrors:
    local-buildcache:
      url: oci://ghcr.io/arborx/spack-buildcache
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      require:
      - target=x86_64_v3
      - os=ubuntu24.04
